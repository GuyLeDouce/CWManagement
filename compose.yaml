services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cwtimeclock
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - cw-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cwtimeclock']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cw-data:
